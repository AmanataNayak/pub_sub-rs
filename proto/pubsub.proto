syntax = "proto3";

package pubsub;

service PubSubService {
  rpc CreateTopic (CreateTopicRequest) returns (CreateTopicResponse);
  rpc CreateSubscription (CreateSubscriptionRequest) returns (CreateSubscriptionResponse);
  rpc Publish (PublishRequest) returns (PublishResponse);

  // Bidirectional streaming endpoint for real-time push delivery & inline Acks
  rpc StreamingPull(stream StreamingPullRequest) returns (stream StreamingPullResponse);
}

message CreateTopicRequest {
  string topic = 1;
}

message CreateTopicResponse {
  bool success = 1;
}

message CreateSubscriptionRequest {
  string topic = 1;
  string subscription = 2;
  uint64 ack_deadline_secs = 3;
  optional uint32 batch_size = 4;
}

message CreateSubscriptionResponse {
  bool success = 1;
}

message PublishRequest {
  string topic = 1;
  bytes payload = 2;
  map<string, string> attributes = 3;
}

message PublishResponse {
  string message_id = 1;
}

message Message {
  string id = 1;
  bytes payload = 2;
  map<string, string> attributes = 3;
  uint32 delivery_attempt = 4;
}

message StreamingPullRequest {
  // First request must set subscription_name
  string subscription_name = 1;
  string topic_name = 2;

  // Subsequent streaming requests send ack IDs to retire
  repeated string ack_ids = 3;
  optional uint32 max_messages = 4;
}

// Server pushes messages directly over the outgoing stream
message StreamingPullResponse {
  repeated Message messages = 1;
}
