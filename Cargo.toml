[package]
name = "pub_sub_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
async-stream = "0.3"
tokio-stream = "0.1"
uuid = { version = "1.8", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tokio-util = { version = "0.7", features = ["codec"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3.34"
tonic = "0.12"
prost = "0.13"
reqwest = "0.12"

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3.0"